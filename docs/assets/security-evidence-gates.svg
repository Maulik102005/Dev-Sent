<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DevSentinel security and evidence gates</title>
  <desc id="desc">Six application-enforced gates protect a DevSentinel run: actor permission, task scope, safe context, durable budgets, Docker isolation, and verified delivery matching.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d0c"/><stop offset="1" stop-color="#10101a"/></linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17201c"/><stop offset="1" stop-color="#101513"/></linearGradient>
    <linearGradient id="shield3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9dffca"/><stop offset="1" stop-color="#42d88a"/></linearGradient>
    <filter id="shadow3" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bf7bd"/></marker>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg3)"/>
  <circle cx="800" cy="450" r="390" fill="none" stroke="#8bf7bd" stroke-opacity=".035" stroke-width="90"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="70" y="76" fill="#8bf7bd" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700" letter-spacing="2.2">DEFENCE IN DEPTH</text>
    <text x="70" y="124" fill="#edf5f0" font-size="38" font-weight="750" letter-spacing="-1.1">Six gates stand between a comment and a code change</text>
    <text x="70" y="158" fill="#93a69c" font-size="16">They are enforced by application code and durable state—not by asking the model to behave.</text>

    <g transform="translate(68 224)" filter="url(#shadow3)">
      <rect width="226" height="250" rx="22" fill="url(#card3)" stroke="#8bf7bd" stroke-opacity=".26"/>
      <path d="M26 30l24-8 24 8v23c0 18-10 30-24 38-14-8-24-20-24-38Z" fill="#8bf7bd" fill-opacity=".08" stroke="#8bf7bd"/>
      <text x="50" y="58" text-anchor="middle" fill="#8bf7bd" font-size="16" font-weight="750">01</text>
      <text x="24" y="118" fill="#edf5f0" font-size="19" font-weight="700">Permission</text>
      <text x="24" y="147" fill="#93a69c" font-size="13">Allowlisted repository.</text>
      <text x="24" y="168" fill="#93a69c" font-size="13">Authorized actor.</text>
      <text x="24" y="189" fill="#93a69c" font-size="13">Rechecked before work</text>
      <text x="24" y="210" fill="#93a69c" font-size="13">and again before publish.</text>
      <rect x="24" y="224" width="92" height="7" rx="4" fill="#8bf7bd" opacity=".65"/>
    </g>
    <g transform="translate(316 224)" filter="url(#shadow3)">
      <rect width="226" height="250" rx="22" fill="url(#card3)" stroke="#8ab9ff" stroke-opacity=".26"/>
      <path d="M27 27h48v48H27zM38 38h26v26H38z" fill="none" stroke="#8ab9ff" stroke-width="2"/>
      <text x="51" y="58" text-anchor="middle" fill="#8ab9ff" font-size="15" font-weight="750">02</text>
      <text x="24" y="118" fill="#edf5f0" font-size="19" font-weight="700">Scope</text>
      <text x="24" y="147" fill="#93a69c" font-size="13">Immutable task brief.</text>
      <text x="24" y="168" fill="#93a69c" font-size="13">Approved source prefixes.</text>
      <text x="24" y="189" fill="#93a69c" font-size="13">Protected tests and paths.</text>
      <text x="24" y="210" fill="#93a69c" font-size="13">Explicit expansion only.</text>
      <rect x="24" y="224" width="116" height="7" rx="4" fill="#8ab9ff" opacity=".65"/>
    </g>
    <g transform="translate(564 224)" filter="url(#shadow3)">
      <rect width="226" height="250" rx="22" fill="url(#card3)" stroke="#c6a7ff" stroke-opacity=".26"/>
      <circle cx="51" cy="51" r="25" fill="#c6a7ff" fill-opacity=".08" stroke="#c6a7ff"/>
      <path d="M39 51h24M51 39v24" stroke="#c6a7ff" stroke-width="2"/>
      <text x="51" y="58" text-anchor="middle" fill="#c6a7ff" font-size="15" font-weight="750">03</text>
      <text x="24" y="118" fill="#edf5f0" font-size="19" font-weight="700">Safe context</text>
      <text x="24" y="147" fill="#93a69c" font-size="13">Bounded relevant retrieval.</text>
      <text x="24" y="168" fill="#93a69c" font-size="13">Secret-like text filtered.</text>
      <text x="24" y="189" fill="#93a69c" font-size="13">Comments are evidence,</text>
      <text x="24" y="210" fill="#93a69c" font-size="13">never authority.</text>
      <rect x="24" y="224" width="132" height="7" rx="4" fill="#c6a7ff" opacity=".65"/>
    </g>
    <g transform="translate(812 224)" filter="url(#shadow3)">
      <rect width="226" height="250" rx="22" fill="url(#card3)" stroke="#f6cb75" stroke-opacity=".3"/>
      <circle cx="51" cy="51" r="25" fill="#f6cb75" fill-opacity=".08" stroke="#f6cb75"/>
      <path d="M51 35v17l12 7" fill="none" stroke="#f6cb75" stroke-width="2" stroke-linecap="round"/>
      <text x="51" y="58" text-anchor="middle" fill="#f6cb75" font-size="15" font-weight="750">04</text>
      <text x="24" y="118" fill="#edf5f0" font-size="19" font-weight="700">Run limits</text>
      <text x="24" y="147" fill="#93a69c" font-size="13">Attempts, time, model use,</text>
      <text x="24" y="168" fill="#93a69c" font-size="13">tool calls, and output.</text>
      <text x="24" y="189" fill="#93a69c" font-size="13">Reserved before uncertainty.</text>
      <text x="24" y="210" fill="#93a69c" font-size="13">Never reset on retry.</text>
      <rect x="24" y="224" width="150" height="7" rx="4" fill="#f6cb75" opacity=".72"/>
    </g>
    <g transform="translate(1060 224)" filter="url(#shadow3)">
      <rect width="226" height="250" rx="22" fill="url(#card3)" stroke="#8ab9ff" stroke-opacity=".3"/>
      <rect x="26" y="27" width="50" height="48" rx="11" fill="#8ab9ff" fill-opacity=".07" stroke="#8ab9ff"/>
      <path d="M36 40h30v22H36zM42 34h18" fill="none" stroke="#8ab9ff" stroke-width="2"/>
      <text x="51" y="58" text-anchor="middle" fill="#8ab9ff" font-size="15" font-weight="750">05</text>
      <text x="24" y="118" fill="#edf5f0" font-size="19" font-weight="700">Sandbox</text>
      <text x="24" y="147" fill="#93a69c" font-size="13">Disposable container.</text>
      <text x="24" y="168" fill="#93a69c" font-size="13">No network during tests.</text>
      <text x="24" y="189" fill="#93a69c" font-size="13">Read-only root and strict</text>
      <text x="24" y="210" fill="#93a69c" font-size="13">resource ceilings.</text>
      <rect x="24" y="224" width="170" height="7" rx="4" fill="#8ab9ff" opacity=".72"/>
    </g>
    <g transform="translate(1308 224)" filter="url(#shadow3)">
      <rect width="226" height="250" rx="22" fill="url(#card3)" stroke="#8bf7bd" stroke-opacity=".38"/>
      <path d="M28 51l14 14 31-35" fill="none" stroke="#8bf7bd" stroke-width="3"/>
      <text x="24" y="118" fill="#edf5f0" font-size="19" font-weight="700">Evidence match</text>
      <text x="24" y="147" fill="#93a69c" font-size="13">Focused + full checks pass.</text>
      <text x="24" y="168" fill="#93a69c" font-size="13">Tree equals saved patch.</text>
      <text x="24" y="189" fill="#93a69c" font-size="13">Branch still matches base.</text>
      <text x="24" y="210" fill="#93a69c" font-size="13">App identity is resolved.</text>
      <rect x="24" y="224" width="178" height="7" rx="4" fill="url(#shield3)"/>
    </g>

    <g transform="translate(68 536)">
      <rect width="1466" height="188" rx="25" fill="#0c1210" stroke="#d3ebde" stroke-opacity=".12"/>
      <text x="28" y="39" fill="#8bf7bd" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="700" letter-spacing="1.6">CREDENTIAL FLOW</text>
      <g transform="translate(28 62)">
        <rect width="250" height="82" rx="16" fill="#141b18" stroke="#d3ebde" stroke-opacity=".12"/>
        <text x="20" y="31" fill="#edf5f0" font-size="15" font-weight="650">GitHub App private key</text>
        <text x="20" y="56" fill="#93a69c" font-size="12">Worker memory only</text>
      </g>
      <path d="M278 103H338" stroke="#8bf7bd" stroke-width="2" marker-end="url(#arr3)"/>
      <g transform="translate(338 62)">
        <rect width="250" height="82" rx="16" fill="#141b18" stroke="#d3ebde" stroke-opacity=".12"/>
        <text x="20" y="31" fill="#edf5f0" font-size="15" font-weight="650">Repo-scoped short token</text>
        <text x="20" y="56" fill="#93a69c" font-size="12">Never persisted or model-visible</text>
      </g>
      <path d="M588 103H648" stroke="#8bf7bd" stroke-width="2" marker-end="url(#arr3)"/>
      <g transform="translate(648 62)">
        <rect width="250" height="82" rx="16" fill="#141b18" stroke="#d3ebde" stroke-opacity=".12"/>
        <text x="20" y="31" fill="#edf5f0" font-size="15" font-weight="650">Fixed GitHub API call</text>
        <text x="20" y="56" fill="#93a69c" font-size="12">Least permission for each phase</text>
      </g>
      <path d="M898 103H958" stroke="#8bf7bd" stroke-width="2" marker-end="url(#arr3)"/>
      <g transform="translate(958 62)">
        <rect width="480" height="82" rx="16" fill="#10231a" stroke="#8bf7bd" stroke-opacity=".32"/>
        <text x="20" y="31" fill="#9dffca" font-size="15" font-weight="700">Browser gets evidence—not repository credentials</text>
        <text x="20" y="56" fill="#93a69c" font-size="12">Dashboard key in an Authorization header • never in URL or persistent storage</text>
      </g>
    </g>

    <g transform="translate(68 766)">
      <rect width="1466" height="78" rx="18" fill="#17140c" stroke="#f6cb75" stroke-opacity=".25"/>
      <circle cx="38" cy="39" r="17" fill="#f6cb75" fill-opacity=".1" stroke="#f6cb75"/>
      <text x="38" y="45" text-anchor="middle" fill="#f6cb75" font-size="18" font-weight="750">!</text>
      <text x="72" y="34" fill="#f0e5c8" font-size="15" font-weight="650">Honest boundary</text>
      <text x="72" y="57" fill="#a99c7b" font-size="13">Local Docker shares the host kernel; install needs registry egress; secret detection is best-effort. Public hostile multi-tenant use needs stronger isolation.</text>
    </g>
  </g>
</svg>
