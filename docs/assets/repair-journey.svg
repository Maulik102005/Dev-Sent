<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DevSentinel repair journey</title>
  <desc id="desc">The repair journey from understanding a sealed task through investigation, planning, patching, verification and review, including clarification, regression reproduction and needs-review branches.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0c"/><stop offset=".55" stop-color="#0b1410"/><stop offset="1" stop-color="#0c1017"/></linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18231e"/><stop offset="1" stop-color="#101713"/></linearGradient>
    <linearGradient id="success2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8bf7bd"/><stop offset="1" stop-color="#42d88a"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8bf7bd"/></marker>
    <marker id="aa2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f6cb75"/></marker>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg2)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="78" fill="#8bf7bd" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700" letter-spacing="2.2">A REPAIR RUN, IN PLAIN ENGLISH</text>
    <text x="72" y="126" fill="#edf5f0" font-size="38" font-weight="750" letter-spacing="-1.2">From issue comment to reviewable evidence</text>
    <text x="72" y="160" fill="#93a69c" font-size="16">The model can suggest. Application policy decides. Docker produces the proof.</text>

    <path d="M152 328H1448" stroke="#26352e" stroke-width="5" stroke-linecap="round"/>
    <path d="M152 328H1448" stroke="url(#success2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 18"/>

    <g transform="translate(80 235)" filter="url(#shadow2)">
      <rect width="210" height="188" rx="22" fill="url(#card2)" stroke="#8bf7bd" stroke-opacity=".28"/>
      <circle cx="42" cy="44" r="21" fill="#8bf7bd" fill-opacity=".12" stroke="#8bf7bd"/>
      <text x="42" y="50" text-anchor="middle" fill="#8bf7bd" font-size="17" font-weight="750">1</text>
      <text x="24" y="88" fill="#edf5f0" font-size="20" font-weight="700">Understand</text>
      <text x="24" y="116" fill="#93a69c" font-size="13">Seal the exact request,</text>
      <text x="24" y="137" fill="#93a69c" font-size="13">actor, scope, criteria,</text>
      <text x="24" y="158" fill="#93a69c" font-size="13">guidance, and commit.</text>
    </g>
    <g transform="translate(326 235)" filter="url(#shadow2)">
      <rect width="210" height="188" rx="22" fill="url(#card2)" stroke="#8ab9ff" stroke-opacity=".28"/>
      <circle cx="42" cy="44" r="21" fill="#8ab9ff" fill-opacity=".12" stroke="#8ab9ff"/>
      <text x="42" y="50" text-anchor="middle" fill="#8ab9ff" font-size="17" font-weight="750">2</text>
      <text x="24" y="88" fill="#edf5f0" font-size="20" font-weight="700">Investigate</text>
      <text x="24" y="116" fill="#93a69c" font-size="13">Search and read only</text>
      <text x="24" y="137" fill="#93a69c" font-size="13">bounded, relevant files.</text>
      <text x="24" y="158" fill="#93a69c" font-size="13">Record what was omitted.</text>
    </g>
    <g transform="translate(572 235)" filter="url(#shadow2)">
      <rect width="210" height="188" rx="22" fill="url(#card2)" stroke="#c6a7ff" stroke-opacity=".28"/>
      <circle cx="42" cy="44" r="21" fill="#c6a7ff" fill-opacity=".12" stroke="#c6a7ff"/>
      <text x="42" y="50" text-anchor="middle" fill="#c6a7ff" font-size="17" font-weight="750">3</text>
      <text x="24" y="88" fill="#edf5f0" font-size="20" font-weight="700">Plan</text>
      <text x="24" y="116" fill="#93a69c" font-size="13">Save the likely cause,</text>
      <text x="24" y="137" fill="#93a69c" font-size="13">evidence, files, exclusions,</text>
      <text x="24" y="158" fill="#93a69c" font-size="13">and checks before editing.</text>
    </g>
    <g transform="translate(818 235)" filter="url(#shadow2)">
      <rect width="210" height="188" rx="22" fill="url(#card2)" stroke="#c6a7ff" stroke-opacity=".28"/>
      <circle cx="42" cy="44" r="21" fill="#c6a7ff" fill-opacity=".12" stroke="#c6a7ff"/>
      <text x="42" y="50" text-anchor="middle" fill="#c6a7ff" font-size="17" font-weight="750">4</text>
      <text x="24" y="88" fill="#edf5f0" font-size="20" font-weight="700">Prepare change</text>
      <text x="24" y="116" fill="#93a69c" font-size="13">Complete replacement text,</text>
      <text x="24" y="137" fill="#93a69c" font-size="13">source-only, inside the</text>
      <text x="24" y="158" fill="#93a69c" font-size="13">approved path boundary.</text>
    </g>
    <g transform="translate(1064 235)" filter="url(#shadow2)">
      <rect width="210" height="188" rx="22" fill="url(#card2)" stroke="#8ab9ff" stroke-opacity=".28"/>
      <circle cx="42" cy="44" r="21" fill="#8ab9ff" fill-opacity=".12" stroke="#8ab9ff"/>
      <text x="42" y="50" text-anchor="middle" fill="#8ab9ff" font-size="17" font-weight="750">5</text>
      <text x="24" y="88" fill="#edf5f0" font-size="20" font-weight="700">Run checks</text>
      <text x="24" y="116" fill="#93a69c" font-size="13">Requested behavior first.</text>
      <text x="24" y="137" fill="#93a69c" font-size="13">Then the complete suite.</text>
      <text x="24" y="158" fill="#93a69c" font-size="13">Compare before and after.</text>
    </g>
    <g transform="translate(1310 235)" filter="url(#shadow2)">
      <rect width="210" height="188" rx="22" fill="url(#card2)" stroke="#8bf7bd" stroke-opacity=".35"/>
      <circle cx="42" cy="44" r="21" fill="#8bf7bd" fill-opacity=".12" stroke="#8bf7bd"/>
      <path d="M32 44l7 7 14-17" fill="none" stroke="#8bf7bd" stroke-width="2.5"/>
      <text x="24" y="88" fill="#edf5f0" font-size="20" font-weight="700">Review</text>
      <text x="24" y="116" fill="#93a69c" font-size="13">Publish a calm report or</text>
      <text x="24" y="137" fill="#93a69c" font-size="13">draft PR. A person makes</text>
      <text x="24" y="158" fill="#93a69c" font-size="13">the final merge decision.</text>
    </g>

    <path d="M185 423V500Q185 520 205 520H382" fill="none" stroke="#f6cb75" stroke-width="2" marker-end="url(#aa2)"/>
    <g transform="translate(382 474)">
      <rect width="330" height="94" rx="18" fill="#211c10" stroke="#f6cb75" stroke-opacity=".55"/>
      <text x="22" y="34" fill="#f6cb75" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="700" letter-spacing="1.5">IF ONE FACT IS MISSING</text>
      <text x="22" y="61" fill="#edf5f0" font-size="16" font-weight="650">Wait for one clear answer</text>
      <text x="22" y="81" fill="#a99c7b" font-size="12">Same snapshot. Same limits. Full provenance.</text>
    </g>
    <path d="M547 474V444Q547 430 557 423" fill="none" stroke="#f6cb75" stroke-width="2" marker-end="url(#aa2)"/>

    <path d="M1169 423V554Q1169 578 1145 578H1102V590" fill="none" stroke="#8ab9ff" stroke-width="2" marker-end="url(#a2)"/>
    <g transform="translate(920 590)">
      <rect width="364" height="138" rx="20" fill="#101923" stroke="#8ab9ff" stroke-opacity=".5"/>
      <text x="22" y="34" fill="#8ab9ff" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="700" letter-spacing="1.5">WHEN OLD TESTS ARE GREEN</text>
      <text x="22" y="64" fill="#edf5f0" font-size="17" font-weight="680">Freeze a new regression check</text>
      <rect x="22" y="84" width="145" height="32" rx="8" fill="#291616" stroke="#ff8e8e" stroke-opacity=".45"/>
      <text x="94" y="105" text-anchor="middle" fill="#ffaaaa" font-size="12">Original: fails ✓</text>
      <path d="M176 100h22" stroke="#8bf7bd" marker-end="url(#a2)"/>
      <rect x="205" y="84" width="137" height="32" rx="8" fill="#10231a" stroke="#8bf7bd" stroke-opacity=".45"/>
      <text x="273" y="105" text-anchor="middle" fill="#9dffca" font-size="12">Candidate: passes ✓</text>
    </g>
    <path d="M1284 659H1340Q1360 659 1360 639V423" fill="none" stroke="#8ab9ff" stroke-width="2" marker-end="url(#a2)"/>

    <g transform="translate(80 628)">
      <rect width="740" height="132" rx="22" fill="#121515" stroke="#d3ebde" stroke-opacity=".13"/>
      <text x="25" y="35" fill="#93a69c" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="700" letter-spacing="1.4">SAFE STOP CONDITIONS</text>
      <g transform="translate(24 55)" font-size="13">
        <rect width="156" height="48" rx="12" fill="#211c10" stroke="#f6cb75" stroke-opacity=".35"/><text x="78" y="29" text-anchor="middle" fill="#f6cb75">Needs an answer</text>
        <rect x="174" width="156" height="48" rx="12" fill="#211c10" stroke="#f6cb75" stroke-opacity=".35"/><text x="252" y="29" text-anchor="middle" fill="#f6cb75">Needs review</text>
        <rect x="348" width="170" height="48" rx="12" fill="#211c10" stroke="#f6cb75" stroke-opacity=".35"/><text x="433" y="29" text-anchor="middle" fill="#f6cb75">Run limit reached</text>
        <rect x="536" width="180" height="48" rx="12" fill="#231314" stroke="#ff8e8e" stroke-opacity=".35"/><text x="626" y="29" text-anchor="middle" fill="#ffaaaa">Could not complete</text>
      </g>
      <text x="25" y="120" fill="#687a71" font-size="12">Stopping honestly is a successful safety behavior—not a reason to widen scope or hide a red check.</text>
    </g>

    <rect x="72" y="806" width="1456" height="2" fill="#d3ebde" opacity=".08"/>
    <text x="72" y="846" fill="#8bf7bd" font-size="13" font-weight="650">The invariant</text>
    <text x="178" y="846" fill="#93a69c" font-size="13">Every retry starts from the captured original snapshot and the saved cumulative patch—never from an unknown workspace.</text>
  </g>
</svg>
