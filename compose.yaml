services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devsentinel
      POSTGRES_USER: devsentinel
      POSTGRES_PASSWORD: devsentinel
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsentinel -d devsentinel"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
